<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SVGMesh — stamp SVGs onto STLs for multicolour printing</title>
    <style>
      :root {
        --bg: #1b1f24;
        --panel: #23282f;
        --line: #333a43;
        --text: #e6e9ee;
        --muted: #98a2b3;
        --accent: #ff8000;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body {
        background: var(--bg); color: var(--text);
        font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
        display: flex;
      }
      #view { flex: 1; position: relative; min-width: 0; }
      #view canvas { display: block; }

      #panel {
        width: 330px; flex: none; background: var(--panel);
        border-left: 1px solid var(--line); padding: 16px; overflow-y: auto;
      }
      h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: .3px; }
      .sub { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
      fieldset { border: 0; border-top: 1px solid var(--line); margin: 0 0 14px; padding: 12px 0 0; }
      legend { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .8px; padding: 0; }
      label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }

      select, input[type="file"], input[type="number"] {
        background: #1b1f24; color: var(--text); border: 1px solid var(--line);
        border-radius: 6px; padding: 6px; font-size: 12px; width: 100%;
      }
      input[type="range"] { width: 100%; }
      input[type="number"] { width: 84px; text-align: right; font-variant-numeric: tabular-nums; }

      button {
        padding: 8px; cursor: pointer; background: var(--accent); color: #1b1f24;
        font-weight: 600; border: 0; border-radius: 6px; font-size: 12px;
      }
      button:disabled { background: #3a4048; color: #7c838c; cursor: not-allowed; }
      button.ghost { background: #2e343d; color: var(--text); font-weight: 500; }
      button.ghost:hover:not(:disabled) { background: #39414c; }
      button.ghost:disabled { background: #262b32; color: #5d646d; }
      #export { width: 100%; margin-top: 10px; padding: 11px; font-size: 13px; }

      .btnRow { display: flex; gap: 6px; margin-top: 8px; }
      .btnRow button { flex: 1; }
      .sliderRow { display: flex; align-items: center; gap: 8px; }
      .sliderRow input[type="range"] { flex: 1; }

      /* asset library */
      #assetGrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
      .asset {
        position: relative; aspect-ratio: 1; border: 1px solid var(--line);
        border-radius: 6px; background: #14171b; cursor: pointer; overflow: hidden;
      }
      .asset:hover { border-color: #5a6472; }
      .asset.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
      .asset img { width: 100%; height: 100%; object-fit: contain; padding: 5px; filter: invert(1) opacity(.85); }
      .asset .x {
        position: absolute; top: 1px; right: 3px; font-size: 13px; line-height: 1;
        color: #99a; opacity: 0; background: none; border: 0; padding: 1px 2px; cursor: pointer;
      }
      .asset:hover .x { opacity: 1; }
      .asset .x:hover { color: #ff6b6b; }

      /* decal list */
      #decalList { margin-top: 8px; }
      .row {
        display: flex; align-items: center; gap: 8px; padding: 6px 8px;
        border: 1px solid transparent; border-radius: 6px; cursor: pointer; font-size: 12px;
      }
      .row:hover { background: #2a3038; }
      .row.sel { background: #2e353f; border-color: var(--accent); }
      .swatch { width: 12px; height: 12px; border-radius: 3px; flex: none; border: 1px solid #00000055; }
      .rowName { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .rowTool { color: var(--muted); font-variant-numeric: tabular-nums; }
      .del { background: none; color: var(--muted); padding: 0 4px; font-size: 15px; line-height: 1; }
      .del:hover { color: #ff6b6b; }
      .empty { color: #6b7480; font-size: 12px; padding: 6px 2px; }

      .alignGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 6px; }
      .alignGrid button { padding: 6px 0; font-size: 11px; }

      .check { display: flex; align-items: center; gap: 7px; margin-top: 10px; font-size: 12px; color: var(--muted); }
      .check input { margin: 0; }

      .note { margin-top: 8px; font-size: 11px; line-height: 1.4; color: var(--muted); }
      #status {
        margin-top: 12px; padding: 10px; border-radius: 6px; background: #1b1f24;
        border: 1px solid var(--line); font-size: 12px; color: var(--muted);
        white-space: pre-wrap; min-height: 42px;
      }
      #version { margin-top: 10px; font-size: 11px; color: #6b7480; text-align: right; }
      #hint {
        position: absolute; left: 16px; bottom: 16px; padding: 8px 12px;
        background: rgba(27,31,36,.85); border: 1px solid var(--line);
        border-radius: 6px; font-size: 12px; color: var(--muted); pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="view"><div id="hint">Load an STL to begin</div></div>

    <div id="panel">
      <h1>SVGMesh</h1>
      <div class="sub">SVG decals → PrusaSlicer 3MF</div>

      <fieldset>
        <legend>Model</legend>
        <input type="file" id="stl" accept=".stl" />
        <label for="base">Model toolhead</label>
        <select id="base">
          <option value="1" selected>Toolhead 1</option>
          <option value="2">Toolhead 2</option>
          <option value="3">Toolhead 3</option>
          <option value="4">Toolhead 4</option>
          <option value="5">Toolhead 5</option>
        </select>
        <div class="btnRow">
          <button class="ghost" id="clearModel" disabled>Remove model</button>
        </div>
      </fieldset>

      <fieldset>
        <legend>SVG library</legend>
        <input type="file" id="svg" accept=".svg" multiple />
        <div id="assetGrid"></div>
        <div class="note" id="assetHint">Add SVGs, pick one, then click the model to place it.</div>
      </fieldset>

      <fieldset>
        <legend>Decals</legend>
        <div id="decalList"></div>
        <div class="btnRow">
          <button class="ghost" id="undo" disabled>Undo</button>
          <button class="ghost" id="redo" disabled>Redo</button>
        </div>
      </fieldset>

      <fieldset id="props" style="display: none">
        <legend>Selected decal</legend>

        <label for="size">Width (mm)</label>
        <div class="sliderRow">
          <input type="range" id="size" min="1" max="200" step="0.1" value="20" />
          <input type="number" id="sizeNum" min="0.1" max="1000" step="0.1" value="20" />
        </div>

        <label for="rot">Rotation (°)</label>
        <div class="sliderRow">
          <input type="range" id="rot" min="-180" max="180" step="1" value="0" />
          <input type="number" id="rotNum" min="-360" max="360" step="0.5" value="0" />
        </div>

        <label for="extruder">Toolhead</label>
        <select id="extruder">
          <option value="1">Toolhead 1</option>
          <option value="2" selected>Toolhead 2</option>
          <option value="3">Toolhead 3</option>
          <option value="4">Toolhead 4</option>
          <option value="5">Toolhead 5</option>
        </select>

        <label for="nudgeStep">Arrow-key step</label>
        <select id="nudgeStep">
          <option value="0.01">0.01 mm</option>
          <option value="0.1">0.1 mm</option>
          <option value="1" selected>1 mm</option>
          <option value="5">5 mm</option>
        </select>

        <label>Align on face</label>
        <div class="alignGrid">
          <button class="ghost" data-align="left">Left</button>
          <button class="ghost" data-align="hcenter">H-centre</button>
          <button class="ghost" data-align="right">Right</button>
          <button class="ghost" data-align="bottom">Bottom</button>
          <button class="ghost" data-align="center">Centre</button>
          <button class="ghost" data-align="top">Top</button>
        </div>

        <label class="check"><input type="checkbox" id="mirrorX" /> Flip artwork horizontally</label>

        <div class="btnRow">
          <button class="ghost" id="mirrorOpposite">Copy to opposite face</button>
        </div>
        <div class="note">Drag on the model to move. Arrow keys nudge. Delete removes.</div>
      </fieldset>

      <fieldset>
        <legend>Output</legend>

        <label for="mode">Decal type</label>
        <select id="mode">
          <option value="parts" selected>Parts — editable in PrusaSlicer</option>
          <option value="paint">Paint — MMU segmentation, mesh untouched</option>
        </select>
        <div class="note" id="modeNote"></div>

        <div id="thicknessWrap">
          <label for="thickness">Decal depth (mm)</label>
          <input type="number" id="thickness" min="0.05" max="10" step="0.05" value="0.6" />
        </div>

        <div id="qualityWrap" style="display: none">
          <label for="quality">Detail</label>
          <select id="quality">
            <option value="0.4">0.4 mm — matches a 0.4 nozzle</option>
            <option value="0.2" selected>0.2 mm — recommended</option>
            <option value="0.1">0.1 mm — thin strokes</option>
            <option value="0.05">0.05 mm — past what FDM resolves</option>
          </select>
        </div>

        <button id="export" disabled>Export 3MF</button>
      </fieldset>

      <div id="status">Load an STL and an SVG, then click the model to place a decal.</div>
      <div id="version"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
